# RootWhisper Render Infrastructure-as-Code Blueprint
# Automatically provisions:
# 1. FastAPI Python Backend Web Service with persistent SSD SQLite storage
# 2. React Vite Static Site Frontend (Global Edge CDN)
services:
  # --------------------------------------------------------------------------
  # 1. FastAPI Backend Service (Requires Starter plan for Persistent SSD Disk)
  # --------------------------------------------------------------------------
  - type: web
    name: rootwhisper-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    disk:
      name: rootwhisper-sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: ENVIRONMENT
        value: production
      - key: ROOTWHISPER_JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false

  # --------------------------------------------------------------------------
  # 2. React Vite Static Frontend (Global Edge CDN - Free Tier)
  # --------------------------------------------------------------------------
  - type: web
    name: rootwhisper-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_ANTIGRAVITY_API_URL
        value: "https://rootwhisper-api.onrender.com/api/v1"
